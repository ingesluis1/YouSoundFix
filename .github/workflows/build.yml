name: Build YouSoundFix

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Theos installeren
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          cp -R /tmp/sdks/iPhoneOS16.5.sdk "$HOME/theos/sdks/"
          brew install ldid make || true
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Bouwen
        run: |
          gmake package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless TARGET=iphone:clang:16.5:14.0
          mkdir -p out
          cp .theos/obj/YouSoundFix.dylib out/
          cp packages/*.deb out/
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: YouSoundFix
          path: out/

      - name: Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest out/* --title "YouSoundFix" --notes "Zet YouSoundFix.dylib in LiveContainer bij YouTube (Tweaks)."
